<!doctype html>
<!--
  OG-Bild-Template (1200x630) für performance-dudes.de — Social/OpenGraph.

  REPRODUZIERBAR, OHNE GEMINI: Der Hintergrund ist das bestehende, textlose
  Marken-Bild `public/og-image.png` (asphalt-navy, Checkered-Flag, orange
  Speed-Lines). Dieses Template legt NUR den Text als Overlay darüber. Zum Ändern
  des Slogans NUR die Texte in <body> unten anpassen, dann neu rendern:

      npm run og        # rendert → public/og-image-text.{png,jpg}

  Der Hintergrund bleibt dabei unangetastet — es wechselt ausschließlich der Text.
  Ohne den Generator geht es auch von Hand: diese Datei in Chrome öffnen,
  Screenshot exakt auf 1200x630, als og-image-text.png speichern.

  Der hervorgehobene Beat ist orange + unterstrichen — hier `Growth beyond headcount.`
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --navy: #1a1a2e;
        --orange: #ea580c;
        --white: #f1f5f9;
        --muted: #d0d0d8;
        /* Schriftgrößen-Preset „big" (Default) — große, plakative Schrift. */
        --fs-eyebrow: 22px;
        --fs-title: 92px;
        --fs-tagline: 40px;
        --ls-title: -3px;
        --mb-eyebrow: 26px;
        --mb-title: 26px;
      }
      /* Preset „compact" (wie das ursprüngliche OG-Bild) — kleinere Schrift,
         engere Abstände. Umschalten: <body class="compact"> bzw. `npm run og -- compact`. */
      body.compact {
        --fs-eyebrow: 18px;
        --fs-title: 56px;
        --fs-tagline: 27px;
        --ls-title: -2px;
        --mb-eyebrow: 20px;
        --mb-title: 18px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        /* Hintergrund = bestehendes Marken-Bild; darüber ein von links nach rechts
           auslaufender Navy-Verlauf, damit der helle Text links immer lesbar bleibt
           und die Checkered-Flag rechts frei sichtbar bleibt. */
        background-image:
          linear-gradient(90deg,
            rgba(16, 16, 30, 0.95) 0%,
            rgba(16, 16, 30, 0.82) 40%,
            rgba(16, 16, 30, 0.28) 66%,
            rgba(16, 16, 30, 0.00) 100%),
          url(../../public/og-image.png);
        background-size: cover, cover;
        background-position: center, center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 90px;
      }

      .content { position: relative; z-index: 2; max-width: 1000px; }

      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        color: var(--muted); font-size: var(--fs-eyebrow); font-weight: 600;
        letter-spacing: 3px; text-transform: uppercase; margin-bottom: var(--mb-eyebrow);
      }
      .eyebrow .dash { width: 46px; height: 3px; background: var(--orange); display: block; }

      .title {
        color: var(--white); font-weight: 800; font-size: var(--fs-title);
        letter-spacing: var(--ls-title); line-height: 1.02; margin-bottom: var(--mb-title);
      }

      /* Text hell, nur der betonte Beat orange (+ unterstrichen) — spiegelt den Hero. */
      .tagline {
        color: var(--white); font-weight: 700; font-size: var(--fs-tagline);
        letter-spacing: 0.5px; line-height: 1.32; max-width: 940px;
      }
      /* nowrap: der hervorgehobene Beat bleibt als Einheit zusammen und bricht als
         Ganzes um, statt „Growth" allein am Zeilenende zu lassen. */
      .tagline u {
        color: var(--orange); white-space: nowrap;
        text-decoration: underline; text-decoration-thickness: 3px;
        text-underline-offset: 5px;
      }
      /* Kompakt: den Lead-in als eigene Zeile setzen, damit der betonte Beat
         darunter im dunklen linken Bereich landet statt einzeilig in die helle
         Flag zu laufen (dort war er kaum lesbar). Nur compact — big bleibt. */
      body.compact .tagline .lead-in { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <!-- ↓↓↓ EDITIERBARER INHALT — bei Slogan-Wechsel nur hier ändern ↓↓↓ -->
    <div class="content">
      <div class="eyebrow"><span class="dash"></span>AI-Native Software Engineering</div>
      <div class="title">Performance Dudes</div>
      <div class="tagline"><span class="lead-in">Agents in the team. People in the lead.</span> <u>Growth beyond headcount.</u></div>
    </div>
    <!-- ↑↑↑ EDITIERBARER INHALT ↑↑↑ -->
  </body>
</html>
